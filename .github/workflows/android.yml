# Fabrique l'application Android de Canari.
#
# Elle sort DEUX fichiers, et ils ne servent pas à la même chose :
#   · canari.apk — à installer directement sur un téléphone Android (on
#     l'envoie par WhatsApp ou on le met sur une clé, et on l'ouvre). C'est
#     celui qu'il faut pour faire essayer l'appli à quelqu'un tout de suite ;
#   · canari.aab — à envoyer au Play Store, et à rien d'autre : Android ne
#     sait pas installer un .aab.
#
# À lancer à la main : onglet « Actions » du dépôt → « Fabriquer
# l'application Android » → « Run workflow ». Les fichiers apparaissent
# ensuite en bas de la page, dans « Artifacts ».
#
# LA CLÉ DE SIGNATURE, ET POURQUOI ELLE N'EST PLUS TÉLÉCHARGEABLE ICI.
# Ce dépôt est PUBLIC. Or les fichiers déposés par une tâche (« artifacts »)
# sont téléchargeables par toute personne qui peut lire le dépôt — c'est-à-dire
# tout le monde. L'ancienne version de cette tâche fabriquait une clé de
# signature et la déposait avec son mot de passe : n'importe qui aurait pu la
# prendre et signer une fausse mise à jour de Canari au nom du propriétaire.
# Elle ne sort donc plus jamais d'ici.
#   · SANS le secret ANDROID_KEYSTORE, la tâche signe avec une clé jetable,
#     fabriquée et détruite dans la foulée. L'APK obtenu s'installe et marche
#     très bien POUR FAIRE ESSAYER, mais il ne peut pas servir au Play Store
#     ni recevoir de mise à jour : il faudra désinstaller puis réinstaller.
#   · AVEC le secret, la vraie clé est utilisée et les deux fichiers sont
#     bons pour le Play Store.
# Comment fabriquer la vraie clé sans qu'elle passe par ici : docs/play-store.md.

name: Fabriquer l'application Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version affiché (ex. 1.1.0)"
        required: false
        default: ""

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Préparer la clé de signature
        id: cle
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -e
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android.keystore
            echo "::add-mask::$KEYSTORE_PASS"
            echo "MOT_DE_PASSE=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "jetable=non" >> "$GITHUB_OUTPUT"
            echo "Clé de signature du propriétaire : utilisée."
          else
            MDP=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
            echo "::add-mask::$MDP"
            keytool -genkeypair -v -keystore android.keystore -alias canari \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$MDP" -keypass "$MDP" \
              -dname "CN=Canari, O=Canari, L=Abidjan, C=CI"
            echo "MOT_DE_PASSE=$MDP" >> "$GITHUB_ENV"
            echo "jetable=oui" >> "$GITHUB_OUTPUT"
            echo "::warning::Pas de secret ANDROID_KEYSTORE : l'APK est signé avec une clé JETABLE. Il s'installe et marche, mais il ne peut pas aller au Play Store ni recevoir de mise à jour. Voir docs/play-store.md."
          fi

      - name: Préparer les outils Android, sans aucune question posée
        run: |
          set -e
          # POURQUOI CETTE ÉTAPE EXISTE. Sur un runner nu, Bubblewrap télécharge
          # lui-même le JDK et le SDK Android, PUIS DEMANDE D'ACCEPTER LES
          # LICENCES — et il attend la réponse. Une tâche automatique n'a
          # personne pour répondre : la première exécution est restée bloquée
          # 64 minutes sur cette question avant d'être arrêtée à la main.
          # On lui donne donc les deux outils déjà installés sur le runner, et
          # les licences sont acceptées d'avance. Plus rien à demander.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "JDK : $JAVA_HOME"
          echo "SDK : $SDK"
          test -d "$SDK" || { echo "::error::SDK Android introuvable sur le runner."; exit 1; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Fabriquer le projet Android
        run: |
          set -e
          # Les journaux d'une tâche ne sont pas lisibles depuis l'extérieur
          # (GitHub les sert depuis un autre serveur). Quand une commande
          # échoue, on recrache donc sa fin dans les ANNOTATIONS de la tâche,
          # qui, elles, se lisent par l'API : c'est la seule façon de savoir
          # ce qui s'est passé sans ouvrir la page à la main.
          raconter() {
            echo "::group::$1"; cat "$2" || true; echo "::endgroup::"
            tail -n 20 "$2" 2>/dev/null | sed 's/^/::error::'"$1"' | /' || true
          }
          if [ -n "${{ github.event.inputs.version }}" ]; then
            node -e "const f='twa-manifest.json';const m=JSON.parse(require('fs').readFileSync(f));m.appVersionName='${{ github.event.inputs.version }}';m.appVersionCode=Math.floor(Date.now()/60000);require('fs').writeFileSync(f,JSON.stringify(m,null,2));"
          fi
          # Chaque commande a son délai maximum : un blocage fait échouer la
          # tâche en quelques minutes, pas en une heure.
          timeout 10m sh -c 'yes | bubblewrap init --manifest="https://mastexcel.github.io/Canari/manifest.webmanifest" --directory=android' > /tmp/init.log 2>&1 || raconter "init" /tmp/init.log
          if [ ! -d android ]; then
            echo "::error::Bubblewrap n'a pas créé le dossier android."
            raconter "init" /tmp/init.log
            exit 1
          fi
          # Notre twa-manifest.json fait loi : nom du paquet, couleurs, et
          # surtout l'ORIENTATION (« any » : portrait ET paysage). « update »
          # régénère le projet à partir de lui, sinon le projet garderait les
          # réponses que « yes » a données à la place de l'utilisateur.
          cp twa-manifest.json android/twa-manifest.json
          cp android.keystore android/android.keystore
          cd android
          timeout 10m sh -c 'yes | bubblewrap update' > /tmp/update.log 2>&1 || raconter "update" /tmp/update.log
          # Les deux mots de passe arrivent par un tube, pas par un clavier.
          # Ils sont masqués par ::add-mask:: : ils ne peuvent pas fuir ici.
          if ! printf '%s\n%s\n' "$MOT_DE_PASSE" "$MOT_DE_PASSE" \
              | timeout 25m bubblewrap build --skipPwaValidation \
                  --signingKeyPath=./android.keystore --signingKeyAlias=canari \
                  > /tmp/build.log 2>&1; then
            raconter "build" /tmp/build.log
            exit 1
          fi
          tail -n 5 /tmp/build.log
          echo "Fichiers produits :"
          find . -name "*.apk" -o -name "*.aab" | head

      - name: Vérifier que l'orientation n'est pas verrouillée
        run: |
          set -e
          # Un verrou « portrait » dans le manifeste Android annulerait tout le
          # travail fait côté CSS : l'appli resterait debout quoi qu'il arrive.
          if grep -rq 'screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::L'application est verrouillée en portrait. Vérifie \"orientation\" dans twa-manifest.json."
            exit 1
          fi
          echo "Orientation libre : portrait et paysage."

      - name: Ranger les fichiers
        run: |
          set -e
          mkdir -p resultat
          # L'APK d'abord : c'est lui qu'on installe sur un téléphone.
          find android -name "*.apk" -exec cp {} resultat/canari.apk \; 2>/dev/null || true
          find android -name "*.aab" -exec cp {} resultat/canari.aab \; 2>/dev/null || true
          # L'empreinte de la clé : elle n'est pas un secret (elle est publique
          # par nature), et le Play Console la demande pour assetlinks.json.
          keytool -list -v -keystore android.keystore -alias canari -storepass "$MOT_DE_PASSE" \
            | grep -A1 "SHA256:" | head -2 > resultat/empreinte-sha256.txt || true
          if [ "${{ steps.cle.outputs.jetable }}" = "oui" ]; then
            # Écrit avec printf et non un sous-document : dans un bloc YAML,
            # les lignes d'un « heredoc » doivent rester indentées, sinon le
            # fichier entier devient illisible pour GitHub.
            printf '%s\n' \
              "CANARI - application Android" \
              "" \
              "canari.apk - a installer sur un telephone Android." \
              "  Envoie-le-toi sur WhatsApp, ouvre-le, accepte \"installer quand meme\"" \
              "  (Android previent pour toute appli qui ne vient pas du Play Store)." \
              "  Premiere ouverture : il faut internet. Ensuite l'appli marche hors ligne." \
              "" \
              "canari.aab - pour le Play Store uniquement. Android ne sait pas l'installer." \
              "" \
              "ATTENTION : cet APK est signe avec une cle JETABLE, parce que le depot est" \
              "public et qu'une vraie cle n'a rien a faire dans un fichier telechargeable" \
              "par n'importe qui. Consequences :" \
              "  - il s'installe et il marche : parfait pour faire essayer l'appli ;" \
              "  - il ne peut PAS etre envoye au Play Store ;" \
              "  - la prochaine version ne s'installera pas par-dessus : il faudra" \
              "    desinstaller celle-ci d'abord." \
              "Pour une vraie cle, voir docs/play-store.md." \
              > resultat/LISEZ-MOI.txt
          fi
          ls -la resultat

      - name: Déposer le résultat
        uses: actions/upload-artifact@v4
        with:
          name: canari-android
          path: resultat/
          retention-days: 30
